name: Firebase Test Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-test-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build app and instrumentation APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.FIREBASE_PROJECT_ID }}'

      - name: Run device matrix in Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --project="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --app=app/build/outputs/apk/debug/app-debug.apk \
            --test=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device=model=shiba,version=34,locale=en,orientation=portrait \
            --device=model=akita,version=35,locale=en,orientation=portrait \
            --use-orchestrator \
            --record-video \
            --timeout=15m \
            --results-bucket="${{ secrets.FIREBASE_RESULTS_BUCKET }}" \
            --results-dir="daymark-lr7-${{ github.run_id }}"
